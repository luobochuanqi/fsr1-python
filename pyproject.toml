[project]
name = "fsr1-python"
version = "0.1.0"
description = "A faithful NumPy port of AMD FidelityFX Super Resolution 1 (EASU + RCAS)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
    "ty>=0.0.82",
]
